<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesat AI — CMS Proposal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #f5f5f5; color: #111; min-height: 100vh; }
    .admin { max-width: 960px; margin: 0 auto; padding: 1rem; }
    .header { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; text-align: center; }
    .header h1 { font-size: 1.3rem; font-weight: 800; }
    .header p { color: #666; font-size: 0.85rem; margin-top: 0.25rem; }

    /* Lock */
    .lock-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .lock-box { background: #fff; border-radius: 16px; padding: 2rem; width: 90%; max-width: 360px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
    .lock-box h2 { font-size: 1.2rem; margin-bottom: 1rem; }
    .lock-box input { width: 100%; padding: 0.7rem 1rem; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 1rem; text-align: center; letter-spacing: 0.2em; }
    .lock-box input:focus { outline: none; border-color: #00d4aa; }
    .lock-box button { margin-top: 0.75rem; width: 100%; padding: 0.7rem; background: #00d4aa; color: #0a0a2e; border: none; border-radius: 10px; font-weight: 700; font-size: 0.95rem; cursor: pointer; }
    .lock-box .error { color: #ef4444; font-size: 0.82rem; margin-top: 0.5rem; display: none; }
    .hidden { display: none !important; }

    /* Tabs */
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .tab { padding: 0.5rem 1rem; border: 1px solid #e5e7eb; border-radius: 8px; background: #fff; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
    .tab.active { background: #00d4aa; color: #0a0a2e; border-color: #00d4aa; }

    /* Cards */
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 1.25rem; margin-bottom: 0.75rem; }
    .card h2 { font-size: 0.95rem; font-weight: 700; margin-bottom: 0.75rem; color: #00d4aa; }
    .field { margin-bottom: 0.75rem; }
    .field label { display: block; font-size: 0.78rem; font-weight: 600; margin-bottom: 0.25rem; color: #666; }
    .field input { width: 100%; padding: 0.55rem 0.75rem; border: 1px solid #e5e7eb; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 0.88rem; }
    .field input:focus { outline: none; border-color: #00d4aa; box-shadow: 0 0 0 2px rgba(0,212,170,0.12); }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }

    /* Toolbar - matching screenshot */
    .toolbar { display: flex; align-items: center; gap: 0; padding: 0.4rem 0.5rem; background: #1a1a2e; border-radius: 8px 8px 0 0; }
    .toolbar button { padding: 0.4rem 0.55rem; border: none; border-radius: 4px; background: transparent; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: #ccc; min-width: 28px; text-align: center; }
    .toolbar button:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .toolbar .sep { width: 1px; height: 20px; background: rgba(255,255,255,0.15); margin: 0 0.25rem; }

    /* Editor - full size */
    .editor-area { width: 100%; min-height: 500px; padding: 1rem; border: 1px solid #e5e7eb; border-top: none; border-radius: 0 0 8px 8px; font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 0.85rem; line-height: 1.7; resize: vertical; tab-size: 2; }
    .editor-area:focus { outline: none; border-color: #00d4aa; }

    /* Actions */
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.75rem; align-items: center; }
    .btn { padding: 0.6rem 1.2rem; border: none; border-radius: 8px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.88rem; cursor: pointer; }
    .btn-save { background: #00d4aa; color: #0a0a2e; }
    .btn-save:hover { background: #00b894; }
    .btn-secondary { background: #f3f4f6; color: #374151; }
    .btn-secondary:hover { background: #e5e7eb; }
    .btn-deploy { background: #0a0a2e; color: #fff; }
    .btn-deploy:hover { background: #1a1a4a; }
    .deploy-status { font-size: 0.82rem; color: #666; margin-left: 0.5rem; }
    .deploy-status.ok { color: #059669; }
    .deploy-status.err { color: #dc2626; }

    /* Toast */
    .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: #0a0a2e; color: #fff; padding: 0.6rem 1.2rem; border-radius: 10px; font-size: 0.85rem; font-weight: 600; opacity: 0; transition: opacity 0.3s; z-index: 200; pointer-events: none; }
    .toast.show { opacity: 1; }

    @media (max-width: 640px) { .admin { padding: 0.5rem; } .card { padding: 1rem; } .row2 { grid-template-columns: 1fr; } .editor-area { min-height: 350px; } }
  </style>
</head>
<body>

  <div class="lock-overlay" id="lock">
    <div class="lock-box">
      <h2>Masukkan Password</h2>
      <input type="password" id="pwd-input" placeholder="••••••" autofocus>
      <button onclick="unlock()">Masuk</button>
      <p class="error" id="pwd-error">Password salah</p>
    </div>
  </div>

  <div class="admin hidden" id="cms">
    <div class="header">
      <h1>Pesat AI — CMS Proposal</h1>
      <p>Edit proposal. Save otomatis tersimpan. Deploy ke live dengan satu klik.</p>
    </div>

    <div class="tabs" id="tabs"></div>
    <div id="editor"></div>

    <div class="actions">
      <button class="btn btn-save" onclick="saveAndDeploy()">Save & Deploy</button>
      <button class="btn btn-secondary" onclick="copyMd()">Copy Markdown</button>
      <button class="btn btn-secondary" onclick="downloadMd()">Download .md</button>
      <span class="deploy-status" id="deploy-status"></span>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const PASSWORD = 'jdp123';
    const STORAGE_KEY = 'pesat_proposals';

    // Default content
    const defaultProposals = {
      bestink: {
        title: 'Proposal GEO/SEO — Best Ink Online',
        client: 'Best Ink Online',
        date: '2026-08-04',
        validUntil: '2026-09-04',
        slug: 'bestink',
        content: ''
      }
    };

    let proposals = {};
    let currentSlug = 'bestink';

    // === PASSWORD ===
    function unlock() {
      if (document.getElementById('pwd-input').value === PASSWORD) {
        document.getElementById('lock').classList.add('hidden');
        document.getElementById('cms').classList.remove('hidden');
        init();
      } else {
        document.getElementById('pwd-error').style.display = 'block';
        document.getElementById('pwd-input').value = '';
      }
    }
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !document.getElementById('lock').classList.contains('hidden')) unlock();
    });

    // === INIT ===
    function init() {
      const saved = localStorage.getItem(STORAGE_KEY);
      proposals = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(defaultProposals));
      if (!saved) localStorage.setItem(STORAGE_KEY, JSON.stringify(proposals));
      renderTabs();
      renderEditor(currentSlug);
    }

    // === TABS ===
    function renderTabs() {
      document.getElementById('tabs').innerHTML = Object.keys(proposals).map(s =>
        `<button class="tab ${s===currentSlug?'active':''}" onclick="switchTab('${s}')">${proposals[s].client}</button>`
      ).join('');
    }
    function switchTab(slug) { saveLocal(); currentSlug = slug; renderTabs(); renderEditor(slug); }

    // === EDITOR ===
    function renderEditor(slug) {
      const p = proposals[slug];
      document.getElementById('editor').innerHTML = `
        <div class="card">
          <h2>Info Dasar</h2>
          <div class="field"><label>Judul</label><input id="f-title" value="${esc(p.title)}"></div>
          <div class="field"><label>Klien</label><input id="f-client" value="${esc(p.client)}"></div>
          <div class="field"><label>Slug (URL)</label><input id="f-slug" value="${esc(p.slug)}"></div>
          <div class="row2">
            <div class="field"><label>Tanggal</label><input id="f-date" type="date" value="${p.date}"></div>
            <div class="field"><label>Berlaku Hingga</label><input id="f-valid" type="date" value="${p.validUntil}"></div>
          </div>
        </div>
        <div class="card" style="padding:0;overflow:hidden;">
          <div style="padding:0.75rem 1.25rem 0;"><h2 style="margin:0;">Konten Proposal</h2></div>
          <div class="toolbar">
            <button onclick="md('**','**')" title="Bold"><b>B</b></button>
            <button onclick="md('*','*')" title="Italic"><i>I</i></button>
            <button onclick="md('__','__')" title="Underline"><u>U</u></button>
            <button onclick="md('~~','~~')" title="Strikethrough"><s>S</s></button>
            <div class="sep"></div>
            <button onclick="md('[text](url)')" title="Link">🔗</button>
            <div class="sep"></div>
            <button onclick="md('1. ')" title="Ordered List">1.</button>
            <button onclick="md('- ')" title="Unordered List">•</button>
            <div class="sep"></div>
            <button onclick="md('## ')" title="Heading 2">H2</button>
            <button onclick="md('### ')" title="Heading 3">H3</button>
            <div class="sep"></div>
            <button onclick="md('> ')" title="Blockquote">❝</button>
            <button onclick="md('---\n')" title="Divider">—</button>
            <button onclick="mdTable()" title="Table">⊞</button>
            <button onclick="mdChecklist()" title="Checklist">☑</button>
          </div>
          <textarea class="editor-area" id="f-content" spellcheck="false">${esc(p.content)}</textarea>
        </div>
      `;
    }

    // === TOOLBAR ===
    function md(before, after='') {
      const ta = document.getElementById('f-content');
      const s = ta.selectionStart, e = ta.selectionEnd;
      const sel = ta.value.substring(s, e) || 'text';
      ta.value = ta.value.substring(0, s) + before + sel + after + ta.value.substring(e);
      ta.focus();
      ta.setSelectionRange(s + before.length, s + before.length + sel.length);
    }
    function mdTable() { md('\n| Kolom 1 | Kolom 2 | Kolom 3 |\n|---|---|---|\n| Data | Data | Data |\n'); }
    function mdChecklist() { md('\n- Item 1\n- Item 2\n- Item 3\n'); }

    // === SAVE ===
    function saveLocal() {
      const p = proposals[currentSlug];
      p.title = document.getElementById('f-title').value;
      p.client = document.getElementById('f-client').value;
      p.date = document.getElementById('f-date').value;
      p.validUntil = document.getElementById('f-valid').value;
      p.slug = document.getElementById('f-slug').value;
      p.content = document.getElementById('f-content').value;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(proposals));
    }

    function generateMd() {
      saveLocal();
      const p = proposals[currentSlug];
      return `---\ntitle: "${p.title}"\nclient: "${p.client}"\ndate: ${p.date}\nvalidUntil: ${p.validUntil}\ndraft: false\n---\n\n${p.content}`;
    }

    // === SAVE & DEPLOY ===
    async function saveAndDeploy() {
      saveLocal();
      const md = generateMd();
      const slug = proposals[currentSlug].slug;
      const status = document.getElementById('deploy-status');
      status.textContent = 'Deploying...';
      status.className = 'deploy-status';

      try {
        // Try Cloudflare Worker auto-deploy
        const resp = await fetch('/api/deploy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slug, content: md })
        });
        if (resp.ok) {
          status.textContent = 'Deployed! Check live site.';
          status.className = 'deploy-status ok';
          toast('Deployed!');
        } else {
          throw new Error('Worker not available');
        }
      } catch (e) {
        // Fallback: copy to clipboard
        await navigator.clipboard.writeText(md);
        status.textContent = 'Copied! Paste ke terminal untuk deploy.';
        status.className = 'deploy-status';
        toast('Markdown copied! Deploy manual.');
      }
    }

    // === EXPORT ===
    function copyMd() { navigator.clipboard.writeText(generateMd()).then(() => toast('Copied!')); }
    function downloadMd() {
      const b = new Blob([generateMd()], {type:'text/markdown'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(b);
      a.download = `${currentSlug}.md`; a.click(); toast('Downloaded!');
    }

    // === UTILS ===
    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function toast(msg) { const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2500); }
  </script>
</body>
</html>
